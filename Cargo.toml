[package]
name = "nvidia-quarterly-revenue"
version = "1.0.0"
edition = "2024"
description = "Extract and visualise NVIDIA quarterly revenue reports"
license = "MIT"

[[bin]]
name = "nvidia-revenue"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
plotters = { version = "0.3.7", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "ttf", "line_series", "area_series", "point_series"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
