name: PDF Downloader Workflow
permissions:
  contents: write

on:
  schedule:
    # Run every Monday at 9:00 AM UTC.
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      check_previous:
        description: 'Number of previous quarters to check'
        required: false
        default: '1'
      check_future:
        description: 'Number of future quarters to check'
        required: false
        default: '2'

concurrency:
  group: revenue-updater-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  download-pdfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Build Rust CLI
        run: |
          rustup toolchain install stable --profile minimal
          rustup override set stable
          sudo apt-get update
          sudo apt-get install -y poppler-utils curl libfontconfig1-dev pkg-config fonts-dejavu-core
          cargo build --release --locked

      - name: Download New PDFs
        id: download
        env:
          CHECK_PREVIOUS: ${{ inputs.check_previous || '1' }}
          CHECK_FUTURE: ${{ inputs.check_future || '2' }}
        run: |
          target/release/nvidia-revenue download --data-dir data \
            --check-previous "$CHECK_PREVIOUS" --check-future "$CHECK_FUTURE" \
            2>&1 | tee "$RUNNER_TEMP/download_output.txt"

          # Keep paths NUL-delimited so multiple files and spaces are safe.
          {
            git diff --name-only -z --diff-filter=ACMR -- 'data/*.pdf'
            git ls-files --others --exclude-standard -z -- 'data/*.pdf'
          } > "$RUNNER_TEMP/new_pdfs.txt"
          if [ -s "$RUNNER_TEMP/new_pdfs.txt" ]; then
            echo "new_pdfs=true" >> "$GITHUB_OUTPUT"
          else
            echo "new_pdfs=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Revenue and Generate Charts
        if: steps.download.outputs.new_pdfs == 'true'
        run: |
          target/release/nvidia-revenue batch --import --data-dir data --db data/data.db \
            --csv data/revenue_export.csv --json data/revenue_export.json
          target/release/nvidia-revenue analyse --data-dir data --output-dir charts

      - name: Commit and Push Changes
        if: steps.download.outputs.new_pdfs == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- 'data/*.pdf' data/data.db data/revenue_export.csv data/revenue_export.json 'charts/*.png'
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            {
              echo "Add new NVIDIA quarterly revenue PDFs"
              echo
              echo "Downloaded PDFs:"
              while IFS= read -r -d '' pdf_file; do
                printf -- '- %s\n' "${pdf_file##*/}"
              done < "$RUNNER_TEMP/new_pdfs.txt"
            } > "$RUNNER_TEMP/commit_msg.txt"
            git commit -F "$RUNNER_TEMP/commit_msg.txt"
            git push
          fi

      - name: Create Release
        if: steps.download.outputs.new_pdfs == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: target/release/nvidia-revenue release --data-dir data

      - name: Summary
        if: always()
        env:
          NEW_PDFS: ${{ steps.download.outputs.new_pdfs }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## PDF Downloader Summary"
            echo
            if [ "$JOB_STATUS" != "success" ]; then
              echo "PDF downloader did not complete successfully ($JOB_STATUS)."
            elif [ "$NEW_PDFS" = "true" ]; then
              echo "New PDFs were downloaded, imported and processed."
            else
              echo "No new PDFs found."
            fi
            if [ -f "$RUNNER_TEMP/download_output.txt" ]; then
              echo
              echo "### Download Log"
              echo '```'
              cat "$RUNNER_TEMP/download_output.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
