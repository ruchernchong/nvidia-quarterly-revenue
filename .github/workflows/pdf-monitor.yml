name: PDF Monitor Workflow
permissions:
  contents: write

on:
  push:
    paths:
      - '**/*.pdf'
  workflow_dispatch:

concurrency:
  group: revenue-updater-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  pdf-updater:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find Changed PDF Files
        id: changed
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] \
            && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            git diff --name-only -z --diff-filter=ACMR "$BEFORE_SHA" HEAD -- '*.pdf' \
              > "$RUNNER_TEMP/changed_pdfs.txt"
          else
            git ls-files -z -- '*.pdf' > "$RUNNER_TEMP/changed_pdfs.txt"
          fi
          if [ -s "$RUNNER_TEMP/changed_pdfs.txt" ]; then
            echo "has_pdfs=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pdfs=false" >> "$GITHUB_OUTPUT"
            echo "No changed PDF files found."
          fi

      - name: Build Rust CLI
        if: steps.changed.outputs.has_pdfs == 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup override set stable
          sudo apt-get update
          sudo apt-get install -y poppler-utils libfontconfig1-dev pkg-config fonts-dejavu-core
          cargo build --release --locked

      - name: Process PDFs and Update Revenue Exports
        if: steps.changed.outputs.has_pdfs == 'true'
        run: |
          while IFS= read -r -d '' pdf_file; do
            target/release/nvidia-revenue analyse "$pdf_file" --output-dir charts
          done < "$RUNNER_TEMP/changed_pdfs.txt"
          target/release/nvidia-revenue batch --import --data-dir data --db data/data.db \
            --csv data/revenue_export.csv --json data/revenue_export.json
          # Charts always show the latest quarter, even when older PDFs change.
          target/release/nvidia-revenue analyse --data-dir data --output-dir charts

      - name: Commit and Push Changes
        if: steps.changed.outputs.has_pdfs == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- data/data.db data/revenue_export.csv data/revenue_export.json 'charts/*.png'
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update revenue data and charts from PDFs"
            git push
          fi

      - name: Create Release
        if: steps.changed.outputs.has_pdfs == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: target/release/nvidia-revenue release --data-dir data
